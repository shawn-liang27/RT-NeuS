[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neus_core*", "neusqa*", "rtneus*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project]
name = "neus-qa"
version = "0.1.0"
description = "NeuS-QA and RT-NeuS: neuro-symbolic long-video question answering"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.10.1",
    "cmake==3.29.6",
    "decord>=0.6.0",
    "einops>=0.8.1",
    "gradio>=5.44.1",
    "ninja>=1.13.0",
    "numpy>=2.3.2",
    "openai>=1.106.1",
    "opencv-python>=4.11.0.86",
    "safetensors>=0.6.2",
    "sentence-transformers>=5.5.1",
    "sentencepiece>=0.2.1",
    "stormpy>=1.10.1",
    "timm>=1.0.19",
    "tqdm>=4.67.1",
    "transformers>=4.41,<4.47",
    "ultralytics>=8.3.201",
]
